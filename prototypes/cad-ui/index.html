<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cad-ui (throwaway prototype)</title>
  <style>
    :root { --bg:#2b2d30; --fg:#aeb2b7; }
    html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui,sans-serif; }
    canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
    #status { position:fixed; left:14px; bottom:12px; pointer-events:none; padding:5px 11px; border-radius:7px; background:rgba(34,36,39,.82); color:#e4e6e8; }
    .axl { position:fixed; font-weight:700; font-size:13px; pointer-events:none; transform:translate(-50%,-50%); left:-100px; top:-100px; text-shadow:0 0 2px rgba(30,32,35,.9), 0 0 4px rgba(30,32,35,.7); }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <svg style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none"><polygon id="ax" /><polygon id="ay" /><polygon id="az" /></svg>
  <div id="status"></div>
  <span class="axl" id="lx">X</span><span class="axl" id="ly">Y</span><span class="axl" id="lz">Z</span>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
