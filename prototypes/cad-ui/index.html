<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cad-ui (throwaway prototype)</title>
  <style>
    :root { color-scheme: dark; --bg:#15171b; --fg:#e8eaee; --line:#3a3f4a; }
    html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui,sans-serif; }
    canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
    #status { position:fixed; left:14px; bottom:12px; opacity:.7; text-shadow:0 1px 2px #000; pointer-events:none; }
    .axl { position:fixed; font-weight:600; font-size:12px; pointer-events:none; transform:translate(-50%,-50%); text-shadow:0 1px 2px #000; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="status"></div>
  <span class="axl" id="lx" style="color:#eb5959">X</span><span class="axl" id="ly" style="color:#66cc73">Y</span><span class="axl" id="lz" style="color:#66a0ff">Z</span>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
