<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Trackpad probe</title>
<style>
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; color: #2b2b30; background: #fff; }
  #pad { position: fixed; inset: 0 0 45% 0; background: #f1f3f5; display: flex; align-items: center; justify-content: center; text-align: center; touch-action: none; font-size: 15px; }
  #sum { position: fixed; left: 12px; right: 12px; top: 56%; font-weight: 600; }
  #log { position: fixed; left: 12px; right: 12px; bottom: 8px; top: 68%; overflow: auto; font: 11px ui-monospace, monospace; white-space: pre; background: #fafafa; border: 1px solid #ddd; padding: 6px; }
</style>
</head>
<body>
<div id="pad">Trackpad probe: do each gesture on this grey area, then read the summary below.<br /><br />1. two-finger scroll only &nbsp; 2. pinch only &nbsp; 3. pinch while moving both fingers across<br /><br />(Nothing here is the app; it only counts what the browser tells a page.)</div>
<div id="sum">no gesture yet</div>
<button id="copy" style="position:fixed;right:12px;top:52%;font:13px system-ui">Copy the log</button>
<div id="log"></div>
<script>
const pad = document.getElementById("pad"), sum = document.getElementById("sum"), log = document.getElementById("log");
let g = null, timer = null, last = 0;
const lines = [];
function start() { g = { wheelPlain: 0, wheelCtrl: 0, gesture: 0, pointerTouch: 0, touch: 0, sumDx: 0, sumDyPlain: 0, sumDyCtrl: 0, t0: performance.now(), xs: new Set(), ys: new Set() }; }
function note(kind, e, extra) {
  if (!g) start();
  clearTimeout(timer); timer = setTimeout(finish, 450);
  const dt = last ? Math.round(e.timeStamp - last) : 0; last = e.timeStamp;
  lines.push(`${kind.padEnd(14)} +${String(dt).padStart(3)}ms ${extra}`); if (lines.length > 400) lines.shift();
  log.textContent = lines.slice(-60).join("\n"); log.scrollTop = log.scrollHeight;
}
function finish() {
  if (!g) return;
  const ms = Math.round(performance.now() - g.t0);
  sum.textContent = `last gesture (${ms} ms): ${g.wheelPlain} plain wheel events (scroll: sum dx ${g.sumDx.toFixed(0)}, dy ${g.sumDyPlain.toFixed(0)}), ${g.wheelCtrl} ctrl wheel events (pinch: sum dy ${g.sumDyCtrl.toFixed(0)}), ${g.gesture} gesture events (Safari), ${g.pointerTouch} touch pointer events, ${g.touch} touch events`
    + (g.wheelPlain && g.wheelCtrl ? "  → BOTH scroll and pinch arrived in one gesture" : g.wheelCtrl ? "  → pinch only" : g.wheelPlain ? "  → scroll only" : "");
  lines.push("--------- " + sum.textContent); log.textContent = lines.slice(-60).join("\n"); log.scrollTop = log.scrollHeight;
  g = null; last = 0;
}
pad.addEventListener("wheel", (e) => {
  e.preventDefault(); note(e.ctrlKey ? "wheel+ctrl" : "wheel", e, `dx ${e.deltaX.toFixed(2)} dy ${e.deltaY.toFixed(2)} mode ${e.deltaMode} at ${Math.round(e.clientX)},${Math.round(e.clientY)}`);
  if (e.ctrlKey) { g.wheelCtrl++; g.sumDyCtrl += e.deltaY; } else { g.wheelPlain++; g.sumDx += e.deltaX; g.sumDyPlain += e.deltaY; }
}, { passive: false });
for (const t of ["gesturestart", "gesturechange", "gestureend"]) pad.addEventListener(t, (e) => { e.preventDefault(); note(t, e, `scale ${(e.scale ?? 0).toFixed(3)} rotation ${(e.rotation ?? 0).toFixed(1)}`); g.gesture++; }, { passive: false });
for (const t of ["pointerdown", "pointermove", "pointerup"]) pad.addEventListener(t, (e) => { if (e.pointerType === "touch") { note(t, e, `id ${e.pointerId} touch at ${Math.round(e.clientX)},${Math.round(e.clientY)}`); g.pointerTouch++; } });
for (const t of ["touchstart", "touchmove", "touchend"]) pad.addEventListener(t, (e) => { note(t, e, `${e.touches.length} touches`); g.touch++; }, { passive: true });
document.getElementById("copy").addEventListener("click", () => { navigator.clipboard.writeText(navigator.userAgent + "\n" + lines.slice(-80).join("\n")).then(() => { document.getElementById("copy").textContent = "Copied"; setTimeout(() => (document.getElementById("copy").textContent = "Copy the log"), 1500); }); });
document.addEventListener("gesturestart", (e) => e.preventDefault());
</script>
</body>
</html>
